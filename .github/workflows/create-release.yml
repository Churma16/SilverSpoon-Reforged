name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Copy 7-Zip Binaries
        shell: powershell
        run: |
          Copy-Item "C:\Program Files\7-Zip\7z.exe" . -ErrorAction Stop
          Copy-Item "C:\Program Files\7-Zip\7z.dll" . -ErrorAction Stop

      - name: Build Executable
        run: |
          pyinstaller --clean SilverSpoon.spec

      - name: Create Zip Archive
        shell: powershell
        run: |
          Compress-Archive -Path "dist/SilverSpoon.exe" -DestinationPath "SilverSpoon-Reforged-${{ github.ref_name }}.zip"

      - name: Extract Release Notes
        id: extract_notes
        uses: ffurrer2/extract-release-notes@v2

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SilverSpoon-Reforged-${{ github.ref_name }}.zip
          body: ${{ steps.extract_notes.outputs.release_notes }}
