name: Extractor Health Check

on:
  schedule:
    # Runs daily at 00:00 UTC (07:00 WIB / UTC+7)
    - cron: '0 0 * * *'
  # Allows triggering the test manually anytime from the GitHub Actions tab
  workflow_dispatch:

jobs:
  health-check:
    name: Check Link Resolver
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests

      - name: Run Extractor Health Check
        env:
          TEST_FUCKINGFAST_URL: ${{ secrets.TEST_FUCKINGFAST_URL }}
          TEST_FUCKINGFAST_URLS: ${{ secrets.TEST_FUCKINGFAST_URLS }}
        run: |
          xvfb-run --auto-servernum python -m pytest tests/test_live_extractor.py -v -s

      - name: Send Telegram Alert on Failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          python .github/scripts/send_canary_alert.py
